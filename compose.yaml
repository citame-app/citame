name: sistersofbeauty

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sob
      POSTGRES_PASSWORD: sob
      POSTGRES_DB: sob
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Wait for the TCP listener used by API and migration containers.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sob", "-d", "sob"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sob:sob@postgres:5432/sob
      VALKEY_URL: redis://valkey:6379
      # Not marked required with `:?` on purpose: Compose resolves that for every service, which
      # would block `docker compose up postgres valkey`. The API refuses to start without it.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The public origin is the web app: the browser only ever talks to it (same-origin BFF).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4173}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:4173}
      # The web service is the single trusted proxy in front of the API (see ADR 0005).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-300}
      RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-60}
      SYNC_PULL_RATE_LIMIT_NETWORK_MAX: ${SYNC_PULL_RATE_LIMIT_NETWORK_MAX:-1200}
      SYNC_PULL_RATE_LIMIT_ACCOUNT_MAX: ${SYNC_PULL_RATE_LIMIT_ACCOUNT_MAX:-150}
      SYNC_PULL_RATE_LIMIT_WINDOW_SECONDS: ${SYNC_PULL_RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      # Development stack: off by default so you can sign up without a mail server. Turn it on
      # (and run `docker compose --profile mail up -d mailpit`, SMTP_URL=smtp://mailpit:1025) to
      # exercise the confirmation flow; compose.prod.yaml has it on.
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # OAuth 2.1 / MCP (ADR 0009). The MCP resource defaults to ${BETTER_AUTH_URL}/mcp.
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${OAUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      OAUTH_REFRESH_TOKEN_TTL_SECONDS: ${OAUTH_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      RATE_LIMIT_OAUTH_MAX: ${RATE_LIMIT_OAUTH_MAX:-60}
      RATE_LIMIT_OAUTH_REGISTER_MAX: ${RATE_LIMIT_OAUTH_REGISTER_MAX:-10}
      RATE_LIMIT_MCP_MAX: ${RATE_LIMIT_MCP_MAX:-120}
      # Notifications (ADR 0010, docs/notifications.md). Off by default: nothing is ever sent
      # until you enable the worker and configure a provider.
      NOTIFY_WORKER_ENABLED: ${NOTIFY_WORKER_ENABLED:-false}
      NOTIFY_EXTERNAL_WORKER_ENABLED: ${NOTIFY_EXTERNAL_WORKER_ENABLED:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      REDSYS_ENVIRONMENT: ${REDSYS_ENVIRONMENT:-test}
      REDSYS_MERCHANT_CODE: ${REDSYS_MERCHANT_CODE:-}
      REDSYS_TERMINAL: ${REDSYS_TERMINAL:-}
      REDSYS_SECRET_KEY: ${REDSYS_SECRET_KEY:-}
      REDSYS_BIZUM_ENABLED: ${REDSYS_BIZUM_ENABLED:-false}
      REDSYS_RECURRING_ENABLED: ${REDSYS_RECURRING_ENABLED:-false}
      PAYMENT_TOKEN_ENCRYPTION_KEY: ${PAYMENT_TOKEN_ENCRYPTION_KEY:-}
      META_WHATSAPP_APP_ID: ${META_WHATSAPP_APP_ID:-}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_GRAPH_VERSION: ${META_WHATSAPP_GRAPH_VERSION:-v27.0}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-none}
      SMTP_URL: ${SMTP_URL:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-Sisters of Beauty <no-reply@localhost>}
      NOTIFY_SMS_PROVIDER: ${NOTIFY_SMS_PROVIDER:-none}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFY_DEFAULT_LOCALE: ${NOTIFY_DEFAULT_LOCALE:-en}
      NOTIFY_PUBLIC_URL: ${NOTIFY_PUBLIC_URL:-}
      PORT: "3000"
    # Loopback only: with TRUST_PROXY=true anything that reaches the API directly could spoof
    # X-Forwarded-For, so the API is not published to the network.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional stand-alone queue worker, same image as the API: `docker compose --profile worker up -d`.
  # Leave NOTIFY_WORKER_ENABLED=false on the api service when you use it.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["bun", "apps/api/src/worker.ts"]
    environment:
      DATABASE_URL: postgres://sob:sob@postgres:5432/sob
      VALKEY_URL: redis://valkey:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4173}
      META_WHATSAPP_APP_ID: ${META_WHATSAPP_APP_ID:-}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_GRAPH_VERSION: ${META_WHATSAPP_GRAPH_VERSION:-v27.0}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-none}
      SMTP_URL: ${SMTP_URL:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-Sisters of Beauty <no-reply@localhost>}
      NOTIFY_SMS_PROVIDER: ${NOTIFY_SMS_PROVIDER:-none}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFY_DEFAULT_LOCALE: ${NOTIFY_DEFAULT_LOCALE:-en}
      NOTIFY_PUBLIC_URL: ${NOTIFY_PUBLIC_URL:-}

  # Local mail catcher for development: SMTP on 1025, inbox UI on http://localhost:8025.
  # `docker compose --profile mail up -d mailpit`, then SMTP_URL=smtp://localhost:1025.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3000
      # Set to true only when an edge proxy you operate sits in front of this service.
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
      PORT: "4173"
    ports:
      - "4173:4173"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:4173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
