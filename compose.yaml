name: sistersofbeauty

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sob
      POSTGRES_PASSWORD: sob
      POSTGRES_DB: sob
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sob -d sob"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sob:sob@postgres:5432/sob
      VALKEY_URL: redis://valkey:6379
      # Not marked required with `:?` on purpose: Compose resolves that for every service, which
      # would block `docker compose up postgres valkey`. The API refuses to start without it.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The public origin is the web app: the browser only ever talks to it (same-origin BFF).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4173}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:4173}
      # The web service is the single trusted proxy in front of the API (see ADR 0005).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-300}
      RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-America/Argentina/Buenos_Aires}
      PORT: "3000"
    # Loopback only: with TRUST_PROXY=true anything that reaches the API directly could spoof
    # X-Forwarded-For, so the API is not published to the network.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3000
      # Set to true only when an edge proxy you operate sits in front of this service.
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
      PORT: "4173"
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
