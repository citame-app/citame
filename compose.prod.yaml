# Production stack: nothing is published except the web service (loopback by default) and, with
# the `tls` profile, Caddy on 80/443. See docs/self-hosting.md and docs/operations.md.
#
#   write a .env next to this file (docs/env-reference.md has a minimal one)
#   docker compose -f compose.prod.yaml up -d --build --wait
#   docker compose -f compose.prod.yaml --profile setup run --rm bootstrap-owner
#   docker compose -f compose.prod.yaml --profile tls up -d --wait --wait-timeout 90     # optional: automatic HTTPS
name: sistersofbeauty-prod

x-api-image: &api-image
  image: ${SOB_API_IMAGE:-sob-api:${SOB_TAG:-local}}
  build:
    context: .
    dockerfile: docker/api.Dockerfile

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *hardened
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sob
      POSTGRES_DB: sob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Postgres needs its data directory, a runtime socket dir and the few capabilities below to
    # drop privileges from root to the postgres user at start.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # The entrypoint's temporary initialization server only listens on a Unix socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sob", "-d", "sob"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  valkey:
    <<: *hardened
    image: valkey/valkey:9.2-alpine
    # The entrypoint starts as root to fix volume ownership, then drops to the valkey user.
    cap_add: [CHOWN, SETUID, SETGID]
    # AOF every second plus periodic snapshots: sessions and rate-limit counters survive a restart.
    command:
      ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "300 10"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  # One-shot: applies pending migrations, then exits. The API and the worker wait for it.
  migrate:
    <<: [*api-image, *hardened]
    restart: "no"
    command: ["bun", "packages/db/src/scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://sob:${POSTGRES_PASSWORD}@postgres:5432/${SOB_DATABASE_NAME:-sob}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  api:
    <<: [*api-image, *hardened]
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://sob:${POSTGRES_PASSWORD}@postgres:5432/${SOB_DATABASE_NAME:-sob}
      VALKEY_URL: redis://valkey:6379
      VALKEY_KEY_PREFIX: "${VALKEY_KEY_PREFIX:-sob:}"
      SYNC_REPLICA_GENERATION: "${SYNC_REPLICA_GENERATION:-initial}"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      # The public origin is the web app: the browser only ever talks to it (same-origin BFF).
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://salon.example}
      TRUSTED_ORIGINS: ${PUBLIC_URL}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${OAUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      OAUTH_REFRESH_TOKEN_TTL_SECONDS: ${OAUTH_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      SYNC_PULL_RATE_LIMIT_NETWORK_MAX: ${SYNC_PULL_RATE_LIMIT_NETWORK_MAX:-1200}
      SYNC_PULL_RATE_LIMIT_ACCOUNT_MAX: ${SYNC_PULL_RATE_LIMIT_ACCOUNT_MAX:-150}
      SYNC_PULL_RATE_LIMIT_WINDOW_SECONDS: ${SYNC_PULL_RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_OAUTH_MAX: ${RATE_LIMIT_OAUTH_MAX:-60}
      RATE_LIMIT_OAUTH_WINDOW_SECONDS: ${RATE_LIMIT_OAUTH_WINDOW_SECONDS:-60}
      RATE_LIMIT_OAUTH_REGISTER_MAX: ${RATE_LIMIT_OAUTH_REGISTER_MAX:-10}
      RATE_LIMIT_OAUTH_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_OAUTH_REGISTER_WINDOW_SECONDS:-60}
      RATE_LIMIT_MCP_MAX: ${RATE_LIMIT_MCP_MAX:-120}
      RATE_LIMIT_MCP_WINDOW_SECONDS: ${RATE_LIMIT_MCP_WINDOW_SECONDS:-60}
      TRUST_PROXY: "true"
      PORT: "3000"
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      REDSYS_ENVIRONMENT: ${REDSYS_ENVIRONMENT:-test}
      REDSYS_MERCHANT_CODE: ${REDSYS_MERCHANT_CODE:-}
      REDSYS_TERMINAL: ${REDSYS_TERMINAL:-}
      REDSYS_SECRET_KEY: ${REDSYS_SECRET_KEY:-}
      REDSYS_BIZUM_ENABLED: ${REDSYS_BIZUM_ENABLED:-false}
      REDSYS_RECURRING_ENABLED: ${REDSYS_RECURRING_ENABLED:-false}
      PAYMENT_TOKEN_ENCRYPTION_KEY: ${PAYMENT_TOKEN_ENCRYPTION_KEY:-}
      PAYMENT_TOKEN_ENCRYPTION_KEY_FILE: ${PAYMENT_TOKEN_ENCRYPTION_KEY_FILE:-}
      META_WHATSAPP_APP_ID: ${META_WHATSAPP_APP_ID:-}
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_APP_SECRET_FILE: ${META_WHATSAPP_APP_SECRET_FILE:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_VERIFY_TOKEN_FILE: ${META_WHATSAPP_VERIFY_TOKEN_FILE:-}
      META_WHATSAPP_GRAPH_VERSION: ${META_WHATSAPP_GRAPH_VERSION:-v27.0}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-smtp}
      SMTP_URL: ${SMTP_URL:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-Sisters of Beauty <no-reply@localhost>}
      NOTIFY_SMS_PROVIDER: ${NOTIFY_SMS_PROVIDER:-none}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFY_CAMPAIGN_TEST_SMS_TO: ${NOTIFY_CAMPAIGN_TEST_SMS_TO:-}
      NOTIFY_PUBLIC_URL: ${PUBLIC_URL}
      NOTIFY_DEFAULT_LOCALE: ${NOTIFY_DEFAULT_LOCALE:-en}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SHUTDOWN_GRACE_MS: "5000"
      # The queue worker runs in its own service below.
      NOTIFY_WORKER_ENABLED: "false"
      NOTIFY_EXTERNAL_WORKER_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "2", memory: 768m }

  # Reminder queue and scheduled housekeeping (sync log compaction, old reminders, expired tokens).
  worker:
    <<: [*api-image, *hardened]
    command: ["bun", "apps/api/src/worker.ts"]
    environment:
      <<: *api-env
      PAYMENT_PROVIDER: none
      REDSYS_SECRET_KEY: ""
      REDSYS_RECURRING_ENABLED: "false"
      PAYMENT_TOKEN_ENCRYPTION_KEY: ""
      PAYMENT_TOKEN_ENCRYPTION_KEY_FILE: ""
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # Leave time for an in-flight SMTP exchange and the database update before SIGKILL.
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "bun", "apps/api/src/scripts/check-worker-ready.ts"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }

  web:
    <<: *hardened
    image: ${SOB_WEB_IMAGE:-sob-web:${SOB_TAG:-local}}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
      PORT: "4173"
      PUBLIC_URL: ${PUBLIC_URL}
      # Off by default: with it on, anyone who can reach the port directly can spoof their address.
      # Set true when a proxy you operate (Caddy via the tls profile, nginx, a cloud LB) sits in front.
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
      BOOKING_WIDGET_ORIGINS: ${BOOKING_WIDGET_ORIGINS:-}
      # Lets the web server refuse WEB_TRUST_PROXY=true on a publicly published port.
      WEB_PUBLISH: ${WEB_PUBLISH:-127.0.0.1:4173}
    depends_on:
      api:
        condition: service_healthy
    # The only published port of the base stack, on loopback: put your TLS proxy in front, or
    # enable the `tls` profile. Use 0.0.0.0:4173 only if something else terminates TLS for you.
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:4173}:4173"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT ?? 4173) + '/api/ready', { redirect: 'error' }).then(async r => process.exit(r.ok && (await r.json()).status === 'ready' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }

  # Optional automatic HTTPS: `docker compose -f compose.prod.yaml --profile tls up -d --wait --wait-timeout 90`.
  caddy:
    profiles: ["tls"]
    restart: unless-stopped
    image: caddy:2.10.2-alpine
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Wait until Caddy loads the HTTP listeners. The admin endpoint stays on container loopback.
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:2019/config/apps/http/servers | grep -q '"listen"'
      interval: 5s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1", memory: 128m }

  # One-shot: creates the first owner (idempotent). OWNER_EMAIL / OWNER_PASSWORD from the environment.
  bootstrap-owner:
    <<: [*api-image]
    profiles: ["setup"]
    restart: "no"
    command: ["bun", "apps/api/src/scripts/bootstrap-owner.ts"]
    environment:
      <<: *api-env
      PAYMENT_PROVIDER: none
      REDSYS_SECRET_KEY: ""
      REDSYS_RECURRING_ENABLED: "false"
      PAYMENT_TOKEN_ENCRYPTION_KEY: ""
      PAYMENT_TOKEN_ENCRYPTION_KEY_FILE: ""
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
