[package]
name = "sob-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline-first core of the Sisters of Beauty desktop client: store, outbox, sync engine, auth."

[dependencies]
url = "=2.5.8"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "=0.10.4"
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["image"] }
ring = "=0.17.14"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
ureq = { version = "=3.5.2", features = ["rustls"] }
uuid = { version = "=1.29.2", features = ["serde", "v7"] }

tempfile = "=3.27.0"
