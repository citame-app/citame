name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the salon situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Alternatives you considered are welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I read "Known limitations and roadmap" in docs/PLAN.md and this is not already listed as a non-goal.
        - label: I am willing to help build or test it.
