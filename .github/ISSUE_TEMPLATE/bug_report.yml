name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help for UI issues.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Web app, Desktop client, MCP / OAuth, Notifications, Docker / deployment, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser and OS, or compose profile and reverse proxy. Never paste secrets.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant JSON log lines (include the X-Request-Id if you have it). Remove personal data.
      render: text
