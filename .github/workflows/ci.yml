name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sob
          POSTGRES_PASSWORD: sob
          POSTGRES_DB: sob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sob -d sob"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sob:sob@localhost:5432/sob
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Fresh database: applies generated and hand-written migrations, then the sample seed.
      # Integration tests create and migrate their own sob_test_* databases on the same server.
      - run: bun run db:migrate
      - run: bun run db:seed
      # First owner: idempotent, so the second run must report that nothing changed.
      # Throwaway CI-only values; real deployments inject their own through secrets.
      - run: |
          bun run bootstrap:owner
          bun run bootstrap:owner
        env:
          BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
          OWNER_EMAIL: ci-owner@example.com
          OWNER_PASSWORD: ci-only-owner-password
      - run: bunx turbo run typecheck lint test build
      # Backup and restore round trip (real pg_dump/pg_restore through the postgres container).
      - run: PG_MODE=docker PG_CONTAINER="$(docker ps -q --filter ancestor=postgres:18-alpine)" bun run test:scripts
      - name: Rust toolchain for production integration tests
        working-directory: apps/desktop
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-production-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/rust-toolchain.toml') }}
      # The native core tests use the same isolated API, Caddy and SMTP fixtures.
      - name: Production deployment smoke test
        run: SMOKE_EMAIL=1 SMOKE_UPGRADE=1 SMOKE_RESTORE=1 SMOKE_DESKTOP=1 bash scripts/smoke-prod.sh

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sob
          POSTGRES_PASSWORD: sob
          POSTGRES_DB: sob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sob -d sob"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mail sink: the e2e tests follow the real verification, reset and invitation links.
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://sob:sob@localhost:5432/sob
      VALKEY_URL: redis://localhost:6379
      # Throwaway CI-only values. The e2e helpers sign in as the owner with this password.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      OWNER_EMAIL: ci-owner@example.com
      OWNER_PASSWORD: correct horse battery staple
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: |
          bun run db:migrate
          bun run db:seed
          bun run bootstrap:owner
      - run: bun run --cwd apps/web build
      # The real stack: the API in production mode behind the web server's same-origin proxy.
      - name: Start API and web
        run: |
          NODE_ENV=production BETTER_AUTH_URL=http://localhost:4173 \
            TRUSTED_ORIGINS=http://localhost:4173 TRUST_PROXY=true \
            NOTIFY_EMAIL_PROVIDER=smtp SMTP_URL=smtp://localhost:1025 \
            RATE_LIMIT_AUTH_MAX=1000 RATE_LIMIT_GLOBAL_MAX=1000000 \
            nohup bun apps/api/src/index.ts > api.log 2>&1 &
          API_INTERNAL_URL=http://localhost:3000 PORT=4173 PUBLIC_URL=http://localhost:4173 \
            nohup bun apps/web/server.ts > web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:3000/health && curl -sf localhost:4173/healthz && exit 0
            sleep 1
          done
          cat api.log web.log
          exit 1
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run --cwd apps/web e2e
        env:
          E2E_OWNER_EMAIL: ci-owner@example.com
          E2E_OWNER_PASSWORD: correct horse battery staple
      - name: Checkout and center management on the isolated fixture
        run: bun run --cwd apps/web e2e --output test-results/pos
        env:
          E2E_POS_FIXTURE: "true"
      # Contention under load against the same stack: one 201 per slot, the rest 409, then SQL proof.
      - uses: grafana/setup-k6-action@v1
      - run: |
          k6 run k6/booking-contention.js
          bun k6/check-overlaps.ts
        env:
          K6_EMAIL: ci-owner@example.com
          K6_PASSWORD: correct horse battery staple
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            api.log
            web.log

  desktop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sob
          POSTGRES_PASSWORD: sob
          POSTGRES_DB: sob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sob -d sob"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sob:sob@localhost:5432/sob
      VALKEY_URL: redis://localhost:6379
      # Throwaway CI-only values.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      OWNER_EMAIL: ci-owner@example.com
      OWNER_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # GPUI links against the Linux graphics stack even for its test runtime.
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1
      # The toolchain is pinned by apps/desktop/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: apps/desktop
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/rust-toolchain.toml') }}
      - run: cargo fmt --check
        working-directory: apps/desktop
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: apps/desktop
      - run: cargo test --workspace --locked
        working-directory: apps/desktop
      # Headless sync tests against the real API, Postgres and Valkey (no server mocks).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: |
          bun run db:migrate
          bun run db:seed
          bun run bootstrap:owner
      - name: Start the API
        run: |
          RATE_LIMIT_AUTH_MAX=1000 RATE_LIMIT_GLOBAL_MAX=100000 PORT=3055 \
            BETTER_AUTH_URL=http://127.0.0.1:3055 nohup bun apps/api/src/index.ts > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:3055/health && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: cargo test -p sob-core --test headless_sync --locked -- --ignored --test-threads=1 --skip through_the_proxy
        working-directory: apps/desktop
        env:
          SOB_TEST_API_URL: http://127.0.0.1:3055
          SOB_TEST_EMAIL: ci-owner@example.com
          SOB_TEST_PASSWORD: ci-only-owner-password
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-api-log
          path: api.log
