name: Release

# Push a tag like v0.1.0 to publish multi-arch images to GHCR, a GitHub release whose notes come from
# CHANGELOG.md, and (best effort) a Linux desktop binary. NOT exercised locally: see
# docs/PLAN.md, "Known limitations and roadmap".
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lower-case owner/repo is computed in the `meta` job because GHCR requires lower case.

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # The tag, every package.json and the Cargo workspace must agree, and CHANGELOG needs the entry.
      - name: Check version consistency
        run: |
          version="${{ steps.v.outputs.version }}"
          for f in package.json apps/api/package.json apps/web/package.json packages/db/package.json packages/contracts/package.json packages/config/package.json; do
            have="$(jq -r .version "$f" 2>/dev/null)"
            [ "$f" = package.json ] && [ "$have" = null ] && continue
            [ "$have" = "$version" ] || { echo "::error::$f is $have, tag is $version"; exit 1; }
          done
          cargo_version="$(grep -m1 '^version' apps/desktop/Cargo.toml | cut -d'"' -f2)"
          [ "$cargo_version" = "$version" ] || { echo "::error::Cargo.toml is $cargo_version, tag is $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }

  images:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.meta.outputs.tag, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and SLSA provenance attestations stored next to the image in the registry.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [meta, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ needs.meta.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty notes for $version"; exit 1; }
          {
            echo
            echo "Images: \`${{ needs.meta.outputs.image_prefix }}-api:$version\` and \`${{ needs.meta.outputs.image_prefix }}-web:$version\` (linux/amd64, linux/arm64)."
          } >> notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md $prerelease
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md $prerelease --verify-tag
          fi

  # Best effort: the GPUI build needs the Linux graphics stack and is the slowest, least tested
  # part of the pipeline. A failure here does not block the release.
  desktop-linux:
    needs: [meta, release]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1
      - name: Rust toolchain
        working-directory: apps/desktop
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        working-directory: apps/desktop
        run: cargo build --release --locked -p sob-desktop
      - name: Package
        run: |
          version="${{ needs.meta.outputs.version }}"
          name="sisters-of-beauty-desktop-$version-linux-x86_64"
          mkdir "$name"
          cp apps/desktop/target/release/sob-desktop "$name/"
          cp LICENSE apps/desktop/README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" sisters-of-beauty-desktop-*.tar.gz* --clobber
