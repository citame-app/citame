name: Release

# Publishing is gated by the reusable CI suite and the required Linux desktop artifact.
# Validation and packaging also run locally without a repository, registry or domain.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.v.outputs.revision }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: v
        name: Validate release metadata and versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bun scripts/release.ts validate

  checks:
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.meta.outputs.revision }}

  desktop-linux:
    needs: [meta, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.revision }}
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1
      - name: Rust toolchain
        working-directory: apps/desktop
        run: rustup show active-toolchain || rustup toolchain install
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-release-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/rust-toolchain.toml') }}
      - name: Build required desktop executable
        working-directory: apps/desktop
        run: cargo build --release --locked -p sob-desktop
      - name: Package reproducible archive and checksum
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: bash scripts/package-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: .release/desktop/*
          if-no-files-found: error

  images:
    needs: [meta, checks, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.revision }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.meta.outputs.tag, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and SLSA provenance attestations stored next to the image in the registry.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [meta, images, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: .release/desktop
      - name: Verify desktop artifact checksums
        working-directory: .release/desktop
        run: sha256sum -c *.sha256
      - name: Prepare verified release notes
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: bun scripts/release.ts notes
      - name: Publish release with required desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file .release/notes.md "${args[@]}"
          else
            gh release create "$TAG" --title "$TAG" --notes-file .release/notes.md --verify-tag "${args[@]}"
          fi
          gh release upload "$TAG" .release/desktop/*.tar.gz* --clobber
